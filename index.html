<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Kartzo</title>
    <meta name="description" content="Everything You Need, Right Around You. Discover local shops, products, services and appointments — all in one place with Kartzo." />
    
    <!-- PWA & Mobile Meta -->
    <meta name="theme-color" content="#087F5B" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icons/kartzo-logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Google Fonts: Unbounded (800 K-monogram), Sora (800 wordmark & 600 headings), DM Sans (body) & Noto Sans Tamil (fallback) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..800&family=Noto+Sans+Tamil:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&family=Unbounded:wght@700;800;900&display=swap" rel="stylesheet" />

    <!-- Anti-Flash Theme Script -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('vaango-theme');
          const isDark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Early PWA Install Prompt Capture: Captures beforeinstallprompt before React mounts -->
    <script>
      (function() {
        window.__kartzoInstallPrompt = null;
        window.__kartzoAppInstalled = false;
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          window.__kartzoInstallPrompt = e;
          try {
            window.dispatchEvent(new CustomEvent('kartzo:installprompt-ready'));
          } catch (_) {}
        });
        window.addEventListener('appinstalled', function() {
          window.__kartzoInstallPrompt = null;
          window.__kartzoAppInstalled = true;
          try {
            window.dispatchEvent(new CustomEvent('kartzo:appinstalled'));
          } catch (_) {}
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
